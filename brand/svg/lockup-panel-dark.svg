<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 256" width="840" height="256" role="img" aria-labelledby="title desc">
  <title id="title">Hyprune lockup panel / dark</title>
  <desc id="desc">Original Hyprune vector artwork. Rounded linework on a 2:1 isometric grid.</desc>
  <rect x="0" y="0" width="840" height="256" rx="24" fill="#0f1a27" />
  <!-- Architecture. Equal stroke weight at every structural edge. -->
  
  
  <!-- One and only boundary opening: endpoints (172,194) and (196,182). -->
  
  <path d="M196 182 208 176V80L128 40 48 80V176L128 216 172 194" fill="none" stroke="#5fa9a4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M128 40V136M48 176 128 136 208 176" fill="none" stroke="#5fa9a4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Offset window heights and unequal panes prevent a paired-eye composition. -->
  
  <path d="M68 92 108 72V116L68 136Z" fill="none" stroke="#8fe8bf" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M152 84 192 104V136L152 116Z" fill="none" stroke="#86d3dc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M78 102 98 92M78 116 98 106" fill="none" stroke="#8fe8bf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M162 104 182 114" fill="none" stroke="#86d3dc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Player is left of the room centre; original Habitat proportions retained. -->
  
  <ellipse cx="92" cy="180" rx="12" ry="6" fill="#8fe8bf"/>
  <rect x="84" y="145" width="16" height="27" rx="8" fill="#d4ffe6" />
  
  
  <!-- Continuous footstep route; room geometry and stroke weights unchanged. -->
  
  <!-- A shallow arc of footsteps starts at the shadow, crosses the same gate, and ends at the destination. -->
  <circle cx="110" cy="180" r="2.5" fill="#d4ffe6"/>
  <circle cx="126" cy="176" r="2.5" fill="#d4ffe6"/>
  <circle cx="142" cy="176" r="2.5" fill="#d4ffe6"/>
  <circle cx="158" cy="180" r="2.5" fill="#d4ffe6"/>
  <circle cx="174" cy="184" r="2.5" fill="#d4ffe6"/>
  <circle cx="184" cy="188" r="2.5" fill="#d4ffe6"/>
  <circle cx="192" cy="192" r="2.5" fill="#d4ffe6"/><circle cx="208" cy="200" r="5" fill="#d4ffe6"/>
  <!-- Original custom lettering and 48-unit ink-to-ink gap retained. -->
  <g transform="translate(266.2 81.2) scale(1.3)"><g transform="translate(0 0)"><path d="M0 76V0M0 47C0 20 44 20 44 47V76" fill="none" stroke="#d4ffe6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /></g>
<g transform="translate(62 0)"><path d="M0 28 22 72M44 28 10 96" fill="none" stroke="#d4ffe6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /></g>
<g transform="translate(124 0)"><path d="M0 96V28M0 43C8 22 44 20 44 52C44 84 8 82 0 62" fill="none" stroke="#d4ffe6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /></g>
<g transform="translate(188 0)"><path d="M0 76V28M0 48C0 30 16 22 32 28" fill="none" stroke="#d4ffe6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /></g>
<g transform="translate(240 0)"><path d="M0 28V54C0 86 44 86 44 54V28" fill="none" stroke="#d4ffe6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /></g>
<g transform="translate(304 0)"><path d="M0 76V28M0 48C0 20 44 20 44 48V76" fill="none" stroke="#d4ffe6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /></g>
<g transform="translate(368 0)"><path d="M2 52H44C44 18 0 18 0 52C0 80 29 83 43 70" fill="none" stroke="#d4ffe6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /></g></g>
</svg>
