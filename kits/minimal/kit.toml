version = 1
name = "Minimal"
description = "One original quiet home, small geometry, no textures, Intel graphics tier."
worlds = ["minimal"]
keymap = "core-default-v2"
shell_theme = "hyprune-dark"
# The world defines the home: room 20, Quiet Desk (workspaceSlot 01) on 21.
initial_workspace = 21
initial_world = "com.hyprune.minimal"
initial_spawn = "arrival"
[settings.graphics]
quality = "intel"
bloom_strength = 0
fov = 60
reduced_motion = true
[[apps]]
workspace = 21
world = "com.hyprune.minimal"
area = "quiet-desk"
class = "HypruneTerminal"
title = "Hyprune desk"
argv = ["kitty", "--class", "HypruneTerminal", "--title", "Hyprune desk"]
mount = "quiet-desk-operator-desk"
