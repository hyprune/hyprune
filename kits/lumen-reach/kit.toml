version = 1
name = "Lumen Reach"
description = "Four workspace homes, live tools, and the connected release-world tour."
worlds = ["lumen-reach"]
keymap = "core-default-v2"
shell_theme = "hyprune-dark"
# The world defines the homes: room 20, then windows.workspace_base (20) + each
# area's workspaceSlot: 21 Sun Court, 22 Array Hall, 23 Rime Vault, 24 Signal Rise.
initial_workspace = 21
initial_world = "com.hyprune.lumen-reach"
initial_spawn = "sun-court"

[settings.graphics]
quality = "high"
fov = 60
reduced_motion = false

[[apps]]
workspace = 21
world = "com.hyprune.lumen-reach"
area = "sun-court"
class = "HypruneTerminal"
title = "Hyprune desk"
argv = ["kitty", "--class", "HypruneTerminal", "--title", "Hyprune desk"]
mount = "sun-court-slot-01-operator-desk-01"
[[apps]]
workspace = 21
world = "com.hyprune.lumen-reach"
area = "sun-court"
class = "HypruneMetrics"
title = "Hyprune kiosk"
argv = ["kitty", "--class", "HypruneMetrics", "--title", "Hyprune kiosk", "btop"]
mount = "sun-court-slot-01-kiosk-pillar-01"
[[apps]]
workspace = 22
world = "com.hyprune.lumen-reach"
area = "array-hall"
class = "HypruneArray"
title = "Array Hall terminal"
argv = ["kitty", "--class", "HypruneArray", "--title", "Array Hall terminal"]
mount = "array-hall-slot-02-operator-desk-01"
[[apps]]
workspace = 23
world = "com.hyprune.lumen-reach"
area = "rime-vault"
class = "HypruneVault"
title = "Rime Vault terminal"
argv = ["kitty", "--class", "HypruneVault", "--title", "Rime Vault terminal"]
mount = "rime-vault-slot-03-operator-desk-01"
[[apps]]
workspace = 24
world = "com.hyprune.lumen-reach"
area = "signal-rise"
class = "HypruneSignal"
title = "Signal Rise terminal"
argv = ["kitty", "--class", "HypruneSignal", "--title", "Signal Rise terminal"]
mount = "signal-rise-slot-04-terminal-bench-01"
